# Place behind your HTTPS reverse proxy. API_URL must match its public URL.
services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      API_URL: ${COBALT_API_URL:?Set the public HTTPS URL}
      API_AUTH_REQUIRED: "1"
      API_KEY_URL: file:///keys.json
    volumes:
      - ./keys.json:/keys.json:ro
